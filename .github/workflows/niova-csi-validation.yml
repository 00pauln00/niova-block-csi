name: niova-csi-validation

on:
  workflow_dispatch:

  push:
    branches:
      - ci-pipeline

jobs:
  csi-validation:
    runs-on: ubuntu-24.04

    timeout-minutes: 120

    steps:
      - name: Verify sources
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la

      - name: Checkout niova-block-csi
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify sources
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la
          ls -la niova-mdsvc

      - name: Update Submodules
        run: |
          git submodule init
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Checkout niova-block
        uses: actions/checkout@v4
        with:
          repository: niova/niova-block
          path: niova-block
          submodules: recursive

      - name: Verify sources
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la
          ls -la niova-mdsvc || true
          ls -la niova-block

      - name: Run CSI setup
        run: |
          chmod +x scripts/csi-setup.sh

          ./scripts/csi-setup.sh \
            /home/runner/csi-workdir \
            "$GITHUB_WORKSPACE/niova-mdsvc" \
            "$GITHUB_WORKSPACE/niova-block" \
            "$GITHUB_WORKSPACE" \
            paro1618/niova-csi \
            v10

      - name: Verify cluster
        run: |
          kubectl get nodes
          kubectl get pods -A
          minikube status

      - name: Verify CSI pods
        run: |
          kubectl get pods -A
          kubectl get pvc
          kubectl get pv

      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs

          kubectl get pods -A > logs/pods.txt

          kubectl logs deployment/niova-csi > logs/controller.log || true

          NODE_POD=$(kubectl get pods \
            -l app=niova-csi-node \
            -o jsonpath='{.items[0].metadata.name}')

          kubectl logs $NODE_POD > logs/node.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csi-logs
          path: logs
